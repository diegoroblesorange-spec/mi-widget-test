<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Webex Click to Call</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 720px; margin: 40px auto; padding: 16px; }
    input, button { padding: 10px; font-size: 16px; }
    input { width: 100%; margin: 8px 0 16px; }
    button { cursor: pointer; }
    #status { margin-top: 16px; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>Webex Click to Call</h1>

  <label>Guest token</label>
  <input id="guestToken" placeholder="Pega aquí el guest token" />

  <label>JWE token</label>
  <input id="jweToken" placeholder="Pega aquí el JWE token" />

  <label>Destino</label>
  <input id="destination" placeholder="+56..." value="+56212345678" />

  <button id="btnInit">Inicializar</button>
  <button id="btnCall" disabled>Llamar</button>

  <div id="status">Estado: esperando...</div>

  <!-- SDK de Webex (bundle que expone Webex global) -->
  <script src="https://unpkg.com/webex@latest/dist/webex.min.js"></script>

  <script>
    let calling;
    let micStream;

    const status = (msg) => {
      document.getElementById('status').textContent = msg;
    };

    document.getElementById('btnInit').addEventListener('click', async () => {
      try {
        if (typeof Webex === 'undefined') {
          status('Error: Webex no está cargado. Revisa la consola del navegador.');
          console.error('Webex is not defined');
          return;
        }

        const guestToken = document.getElementById('guestToken').value.trim();
        const jweToken = document.getElementById('jweToken').value.trim();

        if (!guestToken || !jweToken) {
          status('Debes ingresar guest token y JWE token.');
          return;
        }

        status('Inicializando SDK...');

        calling = Webex.init({
          guestToken,
          calling: true
        });

        await calling.ready();

        status('SDK listo. Pidiendo micrófono...');
        micStream = await navigator.mediaDevices.getUserMedia({ audio: true });

        calling.callingClient.init();

        status('Inicializado. Puedes presionar "Llamar".');
        document.getElementById('btnCall').disabled = false;
      } catch (err) {
        console.error(err);
        status('Error inicializando:\n' + (err?.message || JSON.stringify(err)));
      }
    });

    document.getElementById('btnCall').addEventListener('click', async () => {
      try {
        const destination = document.getElementById('destination').value.trim();
        const jweToken = document.getElementById('jweToken').value.trim();

        if (!calling) {
          status('Primero inicializa el SDK.');
          return;
        }

        status('Preparando llamada...');

        const lines = calling.callingClient.getLines();
        const line = Object.values(lines)[0];

        if (!line) {
          status('No se encontró una línea disponible.');
          return;
        }

        const call = line.makeCall({
          destination,
          jweToken
        });

        await call.dial(micStream);

        status('Llamada iniciada.');
      } catch (err) {
        console.error(err);
        status('Error en llamada:\n' + (err?.message || JSON.stringify(err)));
      }
    });
  </script>
</body>
</html>
