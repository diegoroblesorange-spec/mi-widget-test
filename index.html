<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Webex Calling Widget</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background-color: #f4f7f6; }
        .card { background: white; padding: 25px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); max-width: 450px; }
        button { background-color: #007a87; color: white; border: none; padding: 12px 20px; border-radius: 5px; font-weight: bold; cursor: pointer; font-size: 15px; }
        button:hover { background-color: #005a63; }
        input { padding: 10px; border: 1px solid #ccc; border-radius: 5px; width: 65%; margin-right: 5px; }
        .status { margin-top: 15px; padding: 10px; border-radius: 5px; background: #e9ecef; font-size: 14px; word-break: break-all; }
    </style>
</head>
<body>

    <div class="card">
        <h2>Webex Calling Widget</h2>
        
        <div id="auth-section">
            <p>Conéctate con tu cuenta de Webex Calling para activar el teléfono web.</p>
            <button id="login-btn" type="button" onclick="iniciarLogin()">Iniciar Sesión con Webex</button>
        </div>

        <div id="calling-section" style="display: none;">
            <p><strong>Usuario:</strong> <span id="user-email">Cargando...</span></p>
            <hr>
            <div style="margin-top: 15px;">
                <input type="text" id="dial-number" placeholder="Ej: +56912345678 o 1001">
                <button id="call-btn" type="button">Llamar</button>
            </div>
        </div>

        <div id="status-box" class="status">Esperando acción...</div>
    </div>

    <!-- Librería oficial de Webex (Alojada en el CDN de Cisco) -->
    <script src="https://code.s3.amazonaws.com/webex-widget-builds/webex-sdk.min.js"></script>

    <script>
        // =========================================================
        // CONFIGURACIÓN DE TU INTEGRATION DE WEBEX
        // =========================================================
        const CLIENT_ID = 'Ca184ab2598ff70c8b60130eb358c608cef020a783b0f39c2c4c6e88291458f59';
        const SCOPES = 'spark:calls_write spark:telephony_config_write spark:kms spark:webrtc_calling guest-issuer:read spark-admin:calls_write spark:telephony_config_read guest-issuer:write spark-admin:telephony_config_read spark-admin:telephony_config_write';
        
        // Obtiene la URL exacta de tu página sin parámetros
        const REDIRECT_URI = window.location.protocol + '//' + window.location.host + window.location.pathname;

        // FUNCIÓN DE LOGIN
        function iniciarLogin() {
            if (!CLIENT_ID) {
                alert('Atención: La variable CLIENT_ID está vacía.');
                return;
            }

            document.getElementById('status-box').innerText = "Redirigiendo al portal de Webex...";

            // Generar URL para flujo Implicit Grant (OAuth 2.0)
            const authUrl = "https://webexapis.com/v1/authorize?" +
                "client_id=" + encodeURIComponent(CLIENT_ID) +
                "&response_type=token" +
                "&redirect_uri=" + encodeURIComponent(REDIRECT_URI) +
                "&scope=" + encodeURIComponent(SCOPES);

            window.location.href = authUrl;
        }

        // CAPTURA DEL TOKEN TRAS AUTENTICARSE
        window.addEventListener('load', function() {
            const statusBox = document.getElementById('status-box');

            // Capturar access_token de la URL (#access_token=...)
            const hash = window.location.hash.substring(1);
            const params = new URLSearchParams(hash);
            const accessToken = params.get('access_token');

            if (accessToken) {
                statusBox.innerText = "Conectando SDK con Webex...";

                try {
                    const webex = window.Webex.init({
                        credentials: { access_token: accessToken }
                    });

                    webex.once('ready', function() {
                        webex.people.get('me').then(function(person) {
                            document.getElementById('user-email').innerText = person.emails[0];
                            document.getElementById('auth-section').style.display = 'none';
                            document.getElementById('calling-section').style.display = 'block';
                            statusBox.innerText = "Sesión iniciada correctamente.";
                        });
                    });

                    document.getElementById('call-btn').addEventListener('click', function() {
                        const destination = document.getElementById('dial-number').value;
                        if (!destination) return alert('Ingresa un número de destino');

                        statusBox.innerText = "Iniciando llamada a " + destination + "...";

                        webex.meetings.create(destination).then(function(meeting) {
                            meeting.join();
                            statusBox.innerText = "Llamada iniciada hacia: " + destination;
                        }).catch(function(err) {
                            statusBox.innerText = "Error al llamar: " + (err.message || err);
                        });
                    });

                } catch (e) {
                    statusBox.innerText = "Error cargando SDK: " + e.message;
                }
            } else {
                statusBox.innerText = "Haz clic en 'Iniciar Sesión con Webex' para comenzar.";
            }
        });
    </script>
</body>
</html>
